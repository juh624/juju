<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva - Bombinhas (SC)</title>

    <link rel="stylesheet" href="../style.css/reserva.css">
</head>

<body>

    <header>

        <a href="home.html">
            <img
                src="../img/logo/ChatGPT Image 22 de ago. de 2026, 13_34_22.png"
                alt="Logo Aurora Turismo"
                class="logo"
            >
        </a>

        <nav>

            <a href="home.html">home</a>

            <a href="sobre.html">sobre</a>

            <a href="destinos.html" class="ativo">destinos</a>

            <a href="contato.html">contato</a>

        </nav>

    </header>


    <main>

        <h1>RESERVA</h1>


        <!-- DETALHES E DADOS PESSOAIS -->

        <section class="reserva">

            <div class="detalhes">

                <h2>DETALHES</h2>

                <p>Destino: Bombinhas (SC)</p>

                <p>Preço: R$ 2.499,00</p>

                <p>Duração: 5 dias/4 noites</p>

                <label for="data">Data da viagem:</label>

<input
    type="date"
    id="data"
    name="data"
>

            </div>


            <div class="dados">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                >


                <label for="telefone">Telefone</label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="Digite seu Telefone"
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu Email"
                >


                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite seu CPF"
                >

            </div>

        </section>


        <!-- QUANTIDADE DE PESSOAS -->

        <section class="quantidade">

            <p>Quantidade de pessoas</p>

            <select id="pessoas">

                <option value="1">1</option>

                <option value="2">2</option>

                <option value="3">3</option>

                <option value="4">4</option>

                <option value="5">5</option>

            </select>

        </section>


        <!-- FORMA DE PAGAMENTO -->

        <section class="pagamento">

            <h2>FORMA DE PAGAMENTO</h2>

            <div class="opcoes">

                <label>
                    <input type="radio" name="pagamento" value="pix">
                    <span>PIX</span>
                </label>

                <label>
                    <input type="radio" name="pagamento" value="boleto">
                    <span>boleto</span>
                </label>

                <label>
                    <input type="radio" name="pagamento" value="cartao">
                    <span>cartão</span>
                </label>

            </div>

        </section>


        <!-- OBSERVAÇÕES -->

        <section class="observacoes">

            <textarea
                placeholder="Digite aqui alguma informação ou
pedido especial sobre sua viagem"
            ></textarea>

        </section>


        <!-- BOTÕES -->

        <section class="botoes">

            <button type="button" class="confirmar">
                CONFIRMAR RESERVA
            </button>

            <a
                href="detalhes.Bombinhas.html"
                class="voltar"
            >
                VOLTAR
            </a>

        </section>

    </main>


    <footer>

        © 2026 Aurora Turismo. Todos os direitos reservados.

    </footer>

</body>

</html>
